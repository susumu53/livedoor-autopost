name: Daily Archive Mega-Curation Auto Post
permissions:
  contents: write

on:
  schedule:
    # 毎日 19:00 JST (UTC 10:00) に一日一回実行
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: '1記事に掲載する人数 (デフォルト: 30)'
        required: false
        default: '30'

jobs:
  post-daily-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Archive Post Script
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          LIVEDOOR_ID: ${{ secrets.LIVEDOOR_ID }}
          LIVEDOOR_BLOG_ID: ${{ secrets.LIVEDOOR_BLOG_ID }}
          LIVEDOOR_API_KEY: ${{ secrets.LIVEDOOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MGS_AFFILIATE_ID: ${{ secrets.MGS_AFFILIATE_ID }}
        run: |
          COUNT="${{ github.event.inputs.count }}"
          if [ -z "$COUNT" ]; then
            COUNT="30"
          fi
          python archive_curator.py --daily-auto --count "$COUNT"

      - name: Commit and push progress
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add archive_progress.json || true
          git commit -m "Update archive curation progress [skip ci]" || echo "No changes to commit"
          git pull --rebase origin master || true
          git push || true
