name: Daily Sex Technique Auto Post
permissions:
  contents: write

on:
  schedule:
    # 毎日 21:00 JST (UTC 12:00) に一日一回自動投稿
    # （アクセスが最も集中する夜のゴールデンタイムに投稿）
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: '投稿したいカテゴリー (foreplay, positions, zones, oral, mind, goods / 空欄で日替わり自動選択)'
        required: false
        default: ''

jobs:
  post-daily-sex-tech:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sex Technique Auto Post Script
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          LIVEDOOR_ID: ${{ secrets.LIVEDOOR_ID }}
          LIVEDOOR_BLOG_ID: ${{ secrets.LIVEDOOR_BLOG_ID }}
          LIVEDOOR_API_KEY: ${{ secrets.LIVEDOOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MGS_AFFILIATE_ID: ${{ secrets.MGS_AFFILIATE_ID }}
          YAHOO_PASSWORD: ${{ secrets.YAHOO_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          CAT="${{ github.event.inputs.category }}"
          if [ -n "$CAT" ]; then
            python sex_technique_engine.py --category "$CAT"
          else
            python sex_technique_engine.py
          fi
