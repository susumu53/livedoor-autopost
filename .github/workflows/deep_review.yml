name: Single Work Deep-Dive Review Auto Post
permissions:
  contents: write

on:
  schedule:
    # 週2回: 毎週火曜日と木曜日の 20:00 JST (UTC 11:00) に濃密レビューを投稿
    - cron: '0 11 * * 2,4'
  workflow_dispatch:
    inputs:
      keyword:
        description: '検索キーワード（手動指定したい場合、空欄で自動トレンド取得）'
        required: false
        default: ''

jobs:
  post-deep-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Single Review Post Script
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          LIVEDOOR_ID: ${{ secrets.LIVEDOOR_ID }}
          LIVEDOOR_BLOG_ID: ${{ secrets.LIVEDOOR_BLOG_ID }}
          LIVEDOOR_API_KEY: ${{ secrets.LIVEDOOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MGS_AFFILIATE_ID: ${{ secrets.MGS_AFFILIATE_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          YAHOO_PASSWORD: ${{ secrets.YAHOO_PASSWORD }}
        run: |
          KEYWORD="${{ github.event.inputs.keyword }}"
          if [ -n "$KEYWORD" ]; then
            python single_review_engine.py --keyword "$KEYWORD" --blog-id ranking000
          else
            python single_review_engine.py --blog-id ranking000
          fi
