name: Daily Ranking Top 10 Auto Post
permissions:
  contents: write

on:
  schedule:
    # 毎日 12:00 JST (UTC 03:00) に一日一回自動投稿
    # （お昼休みのアクセスピークに合わせて投稿）
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: '特定ジャンル指定（空欄で12大フェチジャンル日替わり自動選定）'
        required: false
        default: ''

jobs:
  post-daily-ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Ranking Script
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          LIVEDOOR_ID: ${{ secrets.LIVEDOOR_ID }}
          LIVEDOOR_BLOG_ID: ranking000
          LIVEDOOR_API_KEY: ${{ secrets.LIVEDOOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MGS_AFFILIATE_ID: ${{ secrets.MGS_AFFILIATE_ID }}
          YAHOO_PASSWORD: ${{ secrets.YAHOO_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          CAT="${{ github.event.inputs.category }}"
          if [ -n "$CAT" ]; then
            python main.py --mode ranking --blog-id ranking000 --category "$CAT"
          else
            python main.py --mode ranking --blog-id ranking000
          fi
