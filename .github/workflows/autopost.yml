name: Livedoor Weekly Curation Auto Post
permissions:
  contents: write
  
on:
  schedule:
    # 週2回実行: 毎週水曜日と日曜日 20:00 JST (UTC 11:00)
    - cron: '0 11 * * 0,3'
  workflow_dispatch:
    inputs:
      theme:
        description: 'まとめ特集テーマ (cosplay, bishojo, legs, mature, busty, ranking / 空欄で曜日別自動選択)'
        required: false
        default: ''
      count:
        description: '1記事に掲載する人数/作品数 (デフォルト: 20)'
        required: false
        default: '20'

jobs:
  post-curation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Curation Auto Post Script
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          LIVEDOOR_ID: ${{ secrets.LIVEDOOR_ID }}
          LIVEDOOR_BLOG_ID: ${{ secrets.LIVEDOOR_BLOG_ID }}
          LIVEDOOR_API_KEY: ${{ secrets.LIVEDOOR_API_KEY }}
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MGS_AFFILIATE_ID: ${{ secrets.MGS_AFFILIATE_ID }}
        run: |
          COUNT="${{ github.event.inputs.count }}"
          if [ -z "$COUNT" ]; then
            COUNT="20"
          fi
          
          THEME="${{ github.event.inputs.theme }}"
          if [ -n "$THEME" ]; then
            python main.py --count "$COUNT" --theme "$THEME"
          else
            python main.py --count "$COUNT"
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add beauty_index_fanza.db last_actresses.json || true
          git commit -m "Update database and actress list [skip ci]" || echo "No changes to commit"
          git pull --rebase origin master || true
          git push || true

