<!-- トップ画面用：アイキャッチ画像自動ローダー -->
<script>
document.addEventListener("DOMContentLoaded", function() {
  var entryLinks = document.querySelectorAll(".photoEntry a");
  
  entryLinks.forEach(function(link) {
    var photoBox = link.querySelector(".photoEntryBox");
    if (!photoBox) return;
    if (photoBox.querySelector("img")) return;

    var articleUrl = link.getAttribute("href");
    if (!articleUrl) return;

    fetch(articleUrl)
      .then(function(res) { return res.text(); })
      .then(function(html) {
        var parser = new DOMParser();
        var doc = parser.parseFromString(html, "text/html");
        var targetImg = doc.querySelector(".st-eyecatch img") || 
                        doc.querySelector(".main-image img") || 
                        doc.querySelector(".article-body img");
        
        if (targetImg && targetImg.getAttribute("src")) {
          var imgSrc = targetImg.getAttribute("src");
          var imgContainer = document.createElement("div");
          imgContainer.className = "photoEntryImg custom-thumb";
          imgContainer.style.cssText = "width:100%; height:200px; overflow:hidden; border-radius:10px 10px 0 0; background:#1a1a2e; margin-bottom:12px;";
          
          var imgElem = document.createElement("img");
          imgElem.src = imgSrc;
          imgElem.alt = "サムネイル";
          imgElem.style.cssText = "width:100%; height:100%; object-fit:cover; display:block; transition:transform 0.3s ease;";
          
          imgContainer.appendChild(imgElem);
          photoBox.insertBefore(imgContainer, photoBox.firstChild);
        }
      })
      .catch(function(err) {
        console.error("サムネイル取得エラー:", err);
      });
  });
});
</script>
